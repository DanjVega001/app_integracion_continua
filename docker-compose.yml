services:
  php:
    container_name: php
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app/:/var/www/public
    env_file:
      - .env
    networks:
      - taskflow-net
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: db
    image: mysql:8.2.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - '3306:3306'
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./app/nginx/:/etc/nginx/conf.d
      - ./app/:/var/www/public
    depends_on:
      - php
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge

volumes:
  db-data:
