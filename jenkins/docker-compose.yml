# Levantar:  docker compose up -d --build     Apagar: docker compose down
services:
  jenkins:
    build: .
    image: jenkins-taskflow:lts
    container_name: jenkins-taskflow
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-estudiante}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-cambiar-esta-clave}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "961"
    restart: unless-stopped

volumes:
  jenkins_home:
