# Levantar:  docker compose up -d --build     Apagar: docker compose down
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy-taskflow
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - taskflow-net
    restart: unless-stopped

  jenkins:
    build: .
    image: jenkins-taskflow:lts
    container_name: jenkins-taskflow
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-estudiante}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-cambiar-esta-clave}
      DOCKER_HOST: "tcp://docker-proxy:2375"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - taskflow-net
    depends_on:
      - docker-proxy
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  taskflow-net:
